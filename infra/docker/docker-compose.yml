# Local development stack. Production uses managed equivalents — see
# docs/15-deployment-architecture.md.
name: evas

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: evas
      POSTGRES_PASSWORD: evas
      POSTGRES_DB: evas
    ports: ['5432:5432']
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # The API waits on this rather than on the container merely starting —
      # Postgres accepts connections several seconds after the process boots.
      test: ['CMD-SHELL', 'pg_isready -U evas -d evas']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports: ['6379:6379']
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
  redis-data:
